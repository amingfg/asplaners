
<!DOCTYPE html>

    <meta charset="UTF-8">

<body>

<div class="dashboard">

    <aside class="sidebar">
        <div class="logo">
            <h1>A.S.Planer</h1>
            <span>PERSONAL PLANNER</span>
        </div>
<button class="mobile-menu-toggle" id="mobile-menu-toggle" type="button">
        ☰
        <span data-i18n="mainMenu">منوی اصلی</span>
    </button>
        <nav class="sidebar-nav" id="sidebar-nav">
            <a href="index.html" class="nav-link"><span>🏠</span> <span data-i18n="dashboard">Dashboard</span></a>
            <a href="calendar.html" class="nav-link"><span>📅</span> <span data-i18n="calendar">Calendar</span></a>
            <a href="goals.html" class="nav-link"><span>🎯</span> <span data-i18n="goals">Goals</span></a>
            <a href="habits.html" class="nav-link"><span>🌱</span> <span data-i18n="habits">Habits</span></a>
            <a href="notes.html" class="nav-link active"><span>📝</span> <span data-i18n="notes">Notes</span></a>
            <a href="charts.html" class="nav-link">
            <span>📊</span>
            <span data-i18n="charts">Charts</span>
        </a>
            <div class="sidebar-bottom">
            <a href="settings.html" class="nav-link"><span>⚙️</span> <span data-i18n="settings">Settings</span></a>
        </div>
        </nav>


        
    </aside>

    <main class="main-content">

        <header class="topbar">
            <div>
                <h1 data-i18n="myNotes">یادداشت‌های من </h1>
                <p data-i18n="notesTopSubtitle">ایده‌ها و افکارت رو ثبت کن.</p>
            </div>

           <!-- MY PROFILE -->

<div class="profile" id="profileSection">

    <a href="profile.html" class="profile-main-link">

        <div class="profile-avatar" id="profileAvatar">

            <span id="defaultAvatar">👤</span>

            <img
                id="profileImage"
                src=""
                alt="Profile Picture"
                hidden
            >

        </div>

        <div class="profile-info">

            <p data-i18n="myProfile">My Profile</p>

            <span id="profileName">Your Name</span>

        </div>

    </a>

    <a
        href="profile.html"
        class="profile-edit-btn"
        title="Edit Profile"
    >
        ✏️
    </a>

</div>

        </header>

        <section class="page-section active" id="notes-page">

            <form id="note-form" class="note-form">

                <input
                    type="text"
                    id="note-title"
                    data-i18n="noteTitlePlaceholder"
                    placeholder="عنوان یادداشت..."
                    required
                >

                <textarea
                    id="note-content"
                    data-i18n="noteContentPlaceholder"
                    placeholder="یادداشتت رو اینجا بنویس..."
                    required
                ></textarea>

                <button type="submit" data-i18n="saveNote">+ ذخیره یادداشت</button>

            </form>

            <div id="notes-list" class="notes-list"></div>

            <p id="notes-empty" data-i18n="emptyNotes">هنوز یادداشتی ثبت نکردی 🌷</p>

        </section>

    </main>

</div>

console.log("Notes page loaded");
